<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Y2Kultura TV Network</title>
  <meta name="description" content="A digital museum of Philippine pop culture from 2000 to 2010, presented as a 2000s TV network.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@1,500&family=Oswald:wght@400;500;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="room">
    <div class="set">
      <section class="tv" aria-label="Television">
        <div class="screen">
          <div id="view" class="view" tabindex="-1" aria-live="polite"></div>
          <canvas id="static" class="static" aria-hidden="true"></canvas>
          <div class="scanlines" aria-hidden="true"></div>
          <div class="glass" aria-hidden="true"></div>
          <div id="osd" class="osd" aria-hidden="true"></div>
        </div>
        <div class="tv-base">
          <span class="brand">Y2KULTURA</span>
          <span class="led" aria-hidden="true"></span>
          <span class="knobs" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
      </section>

      <nav class="remote" aria-label="Remote control">
        <div class="remote-display" id="remote-display">CH 00</div>
        <div class="remote-row">
          <button class="rb rb-power" data-act="home" aria-label="Power: back to the start" title="Home"><i class="ti ti-power"></i></button>
          <button class="rb" data-act="sound" id="sound-btn" aria-label="Sound off" title="Static sound"><i class="ti ti-volume-off"></i></button>
        </div>
        <div class="remote-row">
          <button class="rb rb-wide" data-act="guide">GUIDE</button>
          <button class="rb rb-wide" data-act="back" aria-label="Back">BACK</button>
        </div>
        <div class="remote-row rocker">
          <button class="rb rb-ch" data-act="up" aria-label="Next channel">P+</button>
          <button class="rb rb-ch" data-act="down" aria-label="Previous channel">P−</button>
        </div>
        <div class="keypad" role="group" aria-label="Channel numbers">
          <button class="rb" data-num="1">1</button><button class="rb" data-num="2">2</button><button class="rb" data-num="3">3</button>
          <button class="rb" data-num="4">4</button><button class="rb" data-num="5">5</button><button class="rb" data-num="6">6</button>
          <button class="rb" data-num="7">7</button><button class="rb" data-num="8">8</button><button class="rb" data-num="9">9</button>
          <span></span><button class="rb" data-num="0">0</button><span></span>
        </div>
        <p class="remote-hint">Keys: PgUp / PgDn change channel, numbers tune in, G for guide</p>
      </nav>
    </div>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
